name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            cpio zip unzip rsync git wget curl python3 python-is-python3 \
            device-tree-compiler ninja-build clang llvm lld

      - name: Setup build env
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p out

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 vendor_defconfig || true
          make O=out ARCH=arm64 menuconfig || true

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/lib/modules
