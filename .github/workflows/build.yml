name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            cpio zip unzip rsync git wget curl python3 python-is-python3 \
            device-tree-compiler ninja-build clang llvm lld

      - name: Build Kernel
        run: |
          # 1. Menyatukan Environment Variables agar tidak hilang antar-proses
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # Membuat folder output kompilasi
          mkdir -p out
          
          # 2. Membuat Konfigurasi Kernel
          # ⚠️ UBAH 'ginkgo_defconfig' di bawah jika nama file defconfig di folder arch/arm64/configs/ Anda berbeda!
          make O=out ARCH=arm64 ginkgo_defconfig
          
          # 3. Proses Kompilasi Utama (Menghapus menuconfig karena memicu hang/macet)
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb*
            out/lib/modules
